<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Expandable Grid Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            padding: 20px;
            color: #fff;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .toggle-input {
            display: none;
        }

        .gallery-item {
            display: block; 
            position: relative;
            background-color: #686868;
            border-radius: 16px;
            border: 0px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            transition: transform 0.2s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .close-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.609);
            color: white;
            border: 0px;
            width: 40px;
            font-size: 32px;
            text-align: center;
        }

        .toggle-input:checked + .gallery-item {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            z-index: 1000;
            border-radius: 0;
            aspect-ratio: auto;
            transform: none;
        }

        .toggle-input:checked + .gallery-item img {
            object-fit: contain;
            background-color: rgba(0, 0, 0, 0.95);
        }

        .toggle-input:checked + .gallery-item .close-btn {
            display: block;
        }
    </style>
</head>
<body>
    <main class="gallery-grid">
    
        <input type="checkbox" id="img1" class="toggle-input">
        <label for="img1" class="gallery-item">
            <span class="close-btn">&times;</span>
            <img src="https://img.magnific.com/free-photo/little-cat-sitting-grass_1150-17019.jpg?semt=ais_hybrid&w=740&q=80" alt="Gallery Image 1">
        </label>

        <input type="checkbox" id="img2" class="toggle-input">
        <label for="img2" class="gallery-item">
            <span class="close-btn">&times;</span>
            <img src="https://img.magnific.com/free-photo/closeup-vertical-shot-cute-european-shorthair-cat_181624-34587.jpg?semt=ais_hybrid&w=740&q=80" alt="Gallery Image 2">
        </label>

        <input type="checkbox" id="img3" class="toggle-input">
        <label for="img3" class="gallery-item">
            <span class="close-btn">&times;</span>
            <img src="https://static.vecteezy.com/system/resources/thumbnails/070/223/834/small/orange-kitten-rests-on-white-wall-outdoors-photo.jpg" alt="Gallery Image 3">
        </label>

        <input type="checkbox" id="img4" class="toggle-input">
        <label for="img4" class="gallery-item">
            <span class="close-btn">&times;</span>
            <img src="https://cdn.britannica.com/32/292832-050-0F7E3B64/Leopardus-tilcayo-cat.jpg" alt="Gallery Image 4">
        </label>

    </main>
</body>
</html>
